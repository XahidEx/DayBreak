# Works with Coolify (Docker Compose build pack) and plain `docker compose up`.
# Every setting is passed explicitly so Coolify's environment variables reach the containers.
x-app-env: &app-env
  DATABASE_URL: postgres://daybreak:${POSTGRES_PASSWORD}@db:5432/daybreak
  SESSION_SECRET: ${SESSION_SECRET}
  COOKIE_SECURE: ${COOKIE_SECURE:-true}
  FMP_API_KEY: ${FMP_API_KEY}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM}
  ADMIN_EMAIL: ${ADMIN_EMAIL}
  BRIEF_CRON: ${BRIEF_CRON:-0 7 * * 2-6}
  BRIEF_TZ: ${BRIEF_TZ:-Asia/Dubai}
  MOVE_THRESHOLD_PCT: ${MOVE_THRESHOLD_PCT:-3}
  HEALTHCHECK_URL: ${HEALTHCHECK_URL:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: daybreak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: daybreak
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daybreak"]
      interval: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    environment: *app-env
    expose: ["3000"]
    ports: ["127.0.0.1:${WEB_PORT:-3006}:3000"]   # host-only port, for a Cloudflare tunnel to point at
    depends_on:
      db: { condition: service_healthy }

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "worker"]
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }

volumes:
  dbdata:
